name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          bin="iprd${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "dist/${bin}" ./cmd/iprd
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "iprd-${GOOS}-${GOARCH}.zip" "${bin}"
          else
            tar -czf "iprd-${GOOS}-${GOARCH}.tar.gz" "${bin}"
          fi
          rm -f "${bin}"

      - uses: actions/upload-artifact@v7
        with:
          name: iprd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum iprd-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/iprd-*
            release/SHA256SUMS
          generate_release_notes: true
